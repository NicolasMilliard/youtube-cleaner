<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
    <title>YouTube Cleaner</title>
  </head>

  <body>
    <main>
      <h1>YouTube Cleaner</h1>

      <fieldset class="theme-selector">
        <legend>Theme</legend>

        <div class="theme-options">
          <label>
            <input type="radio" name="theme" value="system" />
            <span>System</span>
          </label>

          <label>
            <input type="radio" name="theme" value="light" />
            <span>Light</span>
          </label>

          <label>
            <input type="radio" name="theme" value="dark" />
            <span>Dark</span>
          </label>
        </div>
      </fieldset>

      <label>
        <input id="hide-shorts" type="checkbox" />
        Hide Shorts
      </label>

      <label>
        <input id="hide-playables" type="checkbox" />
        Hide Playables
      </label>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
