<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
    <title>YouTube Essentials</title>
  </head>

  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>YouTube Essentials</h1>
          <p>YouTube, minus the noise.</p>
        </div>
      </header>

      <section class="panel">
        <div class="panel__header">
          <h2>Content</h2>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="hide-shorts">
            <span id="hide-shorts-label" class="setting-row__label">Hide Shorts</span>
            <span id="hide-shorts-description" class="setting-row__description">
              Remove Shorts from navigation and recommendations.
            </span>
          </label>

          <label class="switch">
            <input
              id="hide-shorts"
              type="checkbox"
              aria-labelledby="hide-shorts-label"
              aria-describedby="hide-shorts-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row setting-row--nested">
          <label class="setting-row__content" for="allow-shorts-on-channels">
            <span id="allow-shorts-on-channels-label" class="setting-row__label">
              Allow on channels
            </span>
            <span id="allow-shorts-on-channels-description" class="setting-row__description">
              Keep Shorts available on creator pages.
            </span>
          </label>

          <label class="switch">
            <input
              id="allow-shorts-on-channels"
              type="checkbox"
              aria-labelledby="allow-shorts-on-channels-label"
              aria-describedby="allow-shorts-on-channels-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="hide-playables">
            <span id="hide-playables-label" class="setting-row__label">Hide Playables</span>
            <span id="hide-playables-description" class="setting-row__description">
              Remove Playables from the home feed.
            </span>
          </label>

          <label class="switch">
            <input
              id="hide-playables"
              type="checkbox"
              aria-labelledby="hide-playables-label"
              aria-describedby="hide-playables-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="hide-yt-featured">
            <span id="hide-yt-featured-label" class="setting-row__label">Hide featured videos</span>
            <span id="hide-yt-featured-description" class="setting-row__description">
              Remove videos featured by YouTube from the home feed.
            </span>
          </label>

          <label class="switch">
            <input
              id="hide-yt-featured"
              type="checkbox"
              aria-labelledby="hide-yt-featured-label"
              aria-describedby="hide-yt-featured-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2>Home</h2>
        </div>

        <div class="setting-row">
          <label class="setting-row__content" for="redirect-home">
            <span id="redirect-home-label" class="setting-row__label"
              >Open Subscriptions by default</span
            >
            <span id="redirect-home-description" class="setting-row__description">
              Open YouTube on your Subscriptions feed.
            </span>
          </label>

          <label class="switch">
            <input
              id="redirect-home"
              type="checkbox"
              aria-labelledby="redirect-home-label"
              aria-describedby="redirect-home-description"
            />
            <span class="switch__control"></span>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2>Appearance</h2>
        </div>

        <fieldset class="theme-selector">
          <legend class="sr-only">Theme</legend>

          <div class="theme-options">
            <label>
              <input type="radio" name="theme" value="system" />
              <span>System</span>
            </label>

            <label>
              <input type="radio" name="theme" value="light" />
              <span>Light</span>
            </label>

            <label>
              <input type="radio" name="theme" value="dark" />
              <span>Dark</span>
            </label>
          </div>
        </fieldset>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
