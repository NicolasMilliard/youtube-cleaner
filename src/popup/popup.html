<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="./popup.css" />
    <title>YouTube Essentials</title>
  </head>

  <body>
    <main class="popup">
      <header class="popup__header">
        <div>
          <h1>YouTube Essentials</h1>
          <p>YouTube, minus the noise.</p>
        </div>
      </header>

      <section class="panel">
        <div class="panel__header">
          <h2>Content</h2>
        </div>

        <div class="setting-row">
          <div class="setting-row__content">
            <span class="setting-row__label">Hide Shorts</span>
            <span class="setting-row__description">
              Remove Shorts from navigation and recommendations.
            </span>
          </div>

          <label class="switch">
            <input id="hide-shorts" type="checkbox" />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row setting-row--nested">
          <div class="setting-row__content">
            <span class="setting-row__label">Allow on channels</span>
            <span class="setting-row__description"> Keep Shorts available on creator pages. </span>
          </div>

          <label class="switch">
            <input id="allow-shorts-on-channels" type="checkbox" />
            <span class="switch__control"></span>
          </label>
        </div>

        <div class="setting-row">
          <div class="setting-row__content">
            <span class="setting-row__label">Hide Playables</span>
            <span class="setting-row__description"> Remove Playables from the home feed. </span>
          </div>

          <label class="switch">
            <input id="hide-playables" type="checkbox" />
            <span class="switch__control"></span>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="panel__header">
          <h2>Appearance</h2>
        </div>

        <fieldset class="theme-selector">
          <legend class="sr-only">Theme</legend>

          <div class="theme-options">
            <label>
              <input type="radio" name="theme" value="system" />
              <span>System</span>
            </label>

            <label>
              <input type="radio" name="theme" value="light" />
              <span>Light</span>
            </label>

            <label>
              <input type="radio" name="theme" value="dark" />
              <span>Dark</span>
            </label>
          </div>
        </fieldset>
      </section>
    </main>

    <script src="./popup.js"></script>
  </body>
</html>
